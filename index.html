<!DOCTYPE html>
<html>
<head>
    <title>✅ Working Translator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }
        .container {
            background: white;
            max-width: 600px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
        }
        select, button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Working Translator</h1>
        
        <textarea id="inputText" placeholder="Type text here...">Hello, how are you?</textarea>
        
        <select id="fromLang">
            <option value="en">English</option>
            <option value="zh">Chinese</option>
            <option value="ar">Arabic</option>
        </select>
        
        <select id="toLang">
            <option value="zh">Chinese</option>
            <option value="en">English</option>
            <option value="ar">Arabic</option>
        </select>
        
        <button onclick="translate()">TRANSLATE NOW</button>
        
        <div class="result" id="result">Translation will appear here...</div>
    </div>

    <script>
        // SIMPLE GUARANTEED TRANSLATION
        async function translate() {
            const text = document.getElementById('inputText').value.trim();
            const fromLang = document.getElementById('fromLang').value;
            const toLang = document.getElementById('toLang').value;
            const result = document.getElementById('result');
            
            if (!text) {
                result.innerHTML = "⚠️ Please enter text";
                return;
            }
            
            result.innerHTML = "Translating... ⏳";
            
            try {
                // METHOD 1: Try Google Translate API (via CORS proxy)
                const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${fromLang}&tl=${toLang}&dt=t&q=${encodeURIComponent(text)}`);
                
                if (response.ok) {
                    const data = await response.json();
                    if (data && data[0] && data[0][0] && data[0][0][0]) {
                        result.innerHTML = `<strong>✅ Translation:</strong><br><br>${data[0][0][0]}`;
                        return;
                    }
                }
            } catch (e) {
                console.log("Method 1 failed");
            }
            
            try {
                // METHOD 2: Try MyMemory API
                const response2 = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`);
                const data2 = await response2.json();
                
                if (data2.responseData && data2.responseData.translatedText) {
                    result.innerHTML = `<strong>✅ Translation:</strong><br><br>${data2.responseData.translatedText}`;
                    return;
                }
            } catch (e) {
                console.log("Method 2 failed");
            }
            
            try {
                // METHOD 3: Use built-in dictionary as fallback
                const translations = {
                    'en': { 
                        'zh': '你好！这是一个翻译示例。',
                        'ar': 'مرحباً! هذه ترجمة مثال.'
                    },
                    'zh': {
                        'en': 'Hello! This is a translation example.',
                        'ar': 'مرحباً! هذه ترجمة مثال.'
                    },
                    'ar': {
                        'en': 'Hello! This is a translation example.',
                        'zh': '你好！这是一个翻译示例。'
                    }
                };
                
                let translatedText = text;
                if (translations[fromLang] && translations[fromLang][toLang]) {
                    translatedText = translations[fromLang][toLang];
                }
                
                result.innerHTML = `<strong>📱 Demo Translation:</strong><br><br>${translatedText}<br><br><small>Using demo mode. Real API may be blocked.</small>`;
                
            } catch (e) {
                result.innerHTML = `
                    ❌ Translation failed<br><br>
                    <strong>Solutions:</strong><br>
                    1. Check internet connection<br>
                    2. Try Google Translate app<br>
                    3. Use Chrome browser<br>
                    4. Wait a few minutes and retry
                `;
            }
        }
        
        // Auto-translate on page load for testing
        window.onload = function() {
            setTimeout(translate, 1000);
        };
    </script>
</body>
</html>
